name: Check odds provider identifiers

on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:

jobs:
  check-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.check_slugs
